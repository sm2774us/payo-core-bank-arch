apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payo-core
resources:
  - ../../base
images:
  - name: payo/ledger-core
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/payo/ledger-core
    newTag: prod
  - name: payo/sanctions-screening
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/payo/sanctions-screening
    newTag: prod
replicas:
  - name: ledger-core
    count: 6
  - name: sanctions-screening
    count: 3
configMapGenerator:
  - name: ledger-core-config
    behavior: merge
    literals:
      - ENVIRONMENT=prod
patches:
  - target:
      kind: Deployment
      name: ledger-core
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
