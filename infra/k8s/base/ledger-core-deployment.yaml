apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-core
  namespace: payo-core
  labels:
    app: ledger-core
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below full capacity mid-deploy — a
      maxSurge: 1          # ledger API cannot have a capacity dip during release
  selector:
    matchLabels:
      app: ledger-core
  template:
    metadata:
      labels:
        app: ledger-core
    spec:
      # Spread pods across AZs/nodes so a single node or AZ failure never
      # takes out a majority of ledger-core replicas.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ledger-core
      containers:
        - name: ledger-core
          image: payo/ledger-core:REPLACED_BY_KUSTOMIZE
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ledger-core-config
            - secretRef:
                name: ledger-core-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-core
  namespace: payo-core
spec:
  selector:
    app: ledger-core
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger-core-pdb
  namespace: payo-core
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ledger-core
