apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanctions-screening
  namespace: payo-core
  labels:
    app: sanctions-screening
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sanctions-screening
  template:
    metadata:
      labels:
        app: sanctions-screening
    spec:
      containers:
        - name: sanctions-screening
          image: payo/sanctions-screening:REPLACED_BY_KUSTOMIZE
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: sanctions-screening
  namespace: payo-core
spec:
  selector:
    app: sanctions-screening
  ports:
    - port: 80
      targetPort: 8001
