name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
      - name: Install pre-commit
        run: pip install pre-commit==3.8.0
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        service: [ledger-core, sanctions-screening, reconciliation-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install service
        working-directory: services/${{ matrix.service }}
        run: pip install -e ".[dev]"
      - name: Run unit tests
        working-directory: services/${{ matrix.service }}
        run: pytest -q -m "not integration"

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledger
          POSTGRES_PASSWORD: payo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ledger-core
        working-directory: services/ledger-core
        run: pip install -e ".[dev]"
      - name: Run integration tests against real Postgres
        working-directory: services/ledger-core
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:payo@localhost:5432/ledger
        run: pytest -q -m integration

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ledger-core, sanctions-screening]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (fails the job on any non-zero exit)
        run: docker build -t payo/${{ matrix.service }}:ci services/${{ matrix.service }}

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
      - name: terraform fmt -check (repo is committed pre-formatted)
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform fmt -check -recursive
      - name: terraform init (backend-less validate mode)
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform validate
