[project]
name = "ledger-core"
version = "0.1.0"
description = "PAYO core banking ledger: double-entry, idempotent, exactly-once transaction engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "aiosqlite==0.20.0",
    "asyncpg==0.29.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "mypy==1.11.2",
    "ruff==0.6.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires a real Postgres instance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
